plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def compose_ui_version = '1.5.4'

def localProperties = new Properties()
def localPropsFile = file('local.properties').exists() ? file('local.properties') : rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def apiBaseUrl = localProperties.getProperty('API_BASE_URL', 'http://10.0.2.2:3000')

android {
    namespace 'com.example.plantidentifier'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.plantidentifier"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation "androidx.compose.ui:ui:${compose_ui_version}"
    implementation "androidx.compose.ui:ui-tooling-preview:${compose_ui_version}"
    implementation 'androidx.compose.material:material:1.5.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
